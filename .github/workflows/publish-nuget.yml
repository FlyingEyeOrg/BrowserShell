name: Publish NuGet

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package_version:
        description: "手动发布的包版本，例如 2.0.1；留空时使用 csproj 中的 Version"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-nuget-${{ github.ref }}-${{ inputs.package_version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and publish
    runs-on: windows-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          # 只发布 BrowserShell.WebView.Wpf；BrowserShell.Service.SDK 不发布（不进入 pack/push），
          # 但仍参与下面的 restore/build，以免它在仓库里静默损坏。
          # tag（v*）只作为触发条件，不决定版本号；手动 dispatch 时填的 package_version
          # 会覆盖 csproj 中的 Version（发应急版本用）。
          function Get-PackageVersion([string]$projectPath) {
              [xml]$project = Get-Content $projectPath
              return [string]$project.Project.PropertyGroup.Version
          }

          $override = "${{ inputs.package_version }}".Trim()
          if ($override) {
              $version = $override
          }
          else {
              $version = Get-PackageVersion "src/BrowserShell.WebView.Wpf/BrowserShell.WebView.Wpf.csproj"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
              throw "无效的 NuGet 版本：$version"
          }

          "package=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "BrowserShell.WebView.Wpf=$version"

      # 说明：逐个项目执行 restore/build，而不是跑整个 .sln——
      # dotnet CLI 的 build/restore 一次只接受一个项目参数（MSB1008）。
      # 示例与 Service.SDK 不是发布内容，但参与构建可提前暴露破坏性变更。
      - name: Restore
        shell: pwsh
        run: |
          $projects = @(
              "src/BrowserShell.WebView.Wpf/BrowserShell.WebView.Wpf.csproj",
              "src/BrowserShell.Service.SDK/BrowserShell.Service.SDK.csproj",
              "samples/BrowserShell.WebView.Wpf.Sample/BrowserShell.WebView.Wpf.Sample.csproj",
              "tests/BrowserShell.WebView.Wpf.Tests/BrowserShell.WebView.Wpf.Tests.csproj"
          )
          foreach ($project in $projects) {
              dotnet restore $project
              if ($LASTEXITCODE -ne 0) { throw "restore 失败：$project" }
          }

      - name: Build
        shell: pwsh
        run: |
          $projects = @(
              "src/BrowserShell.WebView.Wpf/BrowserShell.WebView.Wpf.csproj",
              "src/BrowserShell.Service.SDK/BrowserShell.Service.SDK.csproj",
              "samples/BrowserShell.WebView.Wpf.Sample/BrowserShell.WebView.Wpf.Sample.csproj",
              "tests/BrowserShell.WebView.Wpf.Tests/BrowserShell.WebView.Wpf.Tests.csproj"
          )
          foreach ($project in $projects) {
              dotnet build $project -c Release --no-restore -p:ContinuousIntegrationBuild=true
              if ($LASTEXITCODE -ne 0) { throw "build 失败：$project" }
          }

      - name: Test
        shell: pwsh
        run: |
          # 发布前跑全部测试，避免发布无效包。
          # Directory.Build.targets 默认过滤掉 EndToEnd / BuildSmoke 类别；
          # 这里沿用默认过滤（未显式传 --filter）。
          dotnet test "tests/BrowserShell.WebView.Wpf.Tests/BrowserShell.WebView.Wpf.Tests.csproj" `
            -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw "test 失败" }

      - name: Pack BrowserShell.WebView.Wpf
        run: dotnet pack src/BrowserShell.WebView.Wpf/BrowserShell.WebView.Wpf.csproj -c Release --no-build --no-restore -o artifacts -p:PackageVersion=${{ steps.version.outputs.package }} -p:ContinuousIntegrationBuild=true -p:IncludeSource=true

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: BrowserShell.WebView.Wpf-${{ steps.version.outputs.package }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Login to NuGet.org with OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: UnknowName

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $name = "BrowserShell.WebView.Wpf"
          $version = "${{ steps.version.outputs.package }}"
          dotnet nuget push "artifacts/$name.$version.nupkg" `
            --source "https://api.nuget.org/v3/index.json" `
            --api-key $env:NUGET_API_KEY `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "$name $version 推送失败（退出码 $LASTEXITCODE）" }
